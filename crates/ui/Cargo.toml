[dependencies]
url = "2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
luna-proto.workspace = true
similar.workspace = true
luna-doc.workspace = true
luna-engine.workspace = true
luna-harness.workspace = true
luna-rpc.workspace = true
luna-sdk.workspace = true
luna-update.workspace = true
luna-syntax.workspace = true
luna-theme.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
gpui-base.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
alacritty_terminal.workspace = true
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
usvg = "0.46"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
unicode-segmentation.workspace = true
unicode-width.workspace = true
fontdb.workspace = true
ttf-parser.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
sha2.workspace = true
roxmltree = "0.21.1"
png = "0.18"
thiserror.workspace = true
rust-embed = "=8.7.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
objc = "0.2"
wry = { version = "0.56", default-features = false, features = ["os-webview"] }
raw-window-handle = "0.6"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSBitmapImageRep", "NSImage", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = "0.3.2"
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKNavigationDelegate", "WKNavigationAction", "WKSnapshotConfiguration"] }
reqwest.workspace = true
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["elcapitan", "highsierra", "link"] }
foreign-types = "0.5"
block = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts", "screenshot"] }
atspi = { version = "0.30.0", features = ["zbus"] }
async-io = "2"
url = "2"
x11rb = { version = "0.14.0", features = ["image"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# Board fixtures seed engine records through the store's commit primitive.
luna-sync.workspace = true
tempfile.workspace = true
mimalloc.workspace = true
tracing-subscriber.workspace = true

# Unix fixtures check that their root is owned by the current user.
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
