[package]
name = "luna-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
luna-doc.workspace = true
luna-proto.workspace = true
loro.workspace = true
loro-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

# NWPathMonitor bridge (net_path.rs) — the update handler is an ObjC block.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"

[features]
# In-process registry server speaking the DO's JSON WS protocol — test
# infrastructure for this crate's tests and luna-engine's integration tests.
mock-server = []

# The registry WS client suite drives the mock server; without this, a
# plain `cargo test -p luna-sync` fails to compile instead of skipping it.
[[test]]
name = "registry_client"
required-features = ["mock-server"]

[dev-dependencies]
chrono.workspace = true
# chat2_live example only (live checkpoint fetch against a deployed worker).
reqwest.workspace = true
luna-proto.workspace = true
tempfile.workspace = true
# `start_paused` virtual-clock tests (the 2026-07-30 sync-stall regressions).
tokio = { workspace = true, features = ["test-util"] }
