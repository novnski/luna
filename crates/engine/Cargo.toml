[package]
name = "luna-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
luna-preview.workspace = true
luna-proto.workspace = true
luna-doc.workspace = true
luna-sync.workspace = true
luna-harness.workspace = true
luna-rpc.workspace = true
luna-update.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
jiff = "0.2.37"
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
libc.workspace = true
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2.workspace = true
url = "2"
flate2.workspace = true
tar.workspace = true
aes-gcm.workspace = true
getrandom.workspace = true
zeroize.workspace = true
reqwest.workspace = true
ignore.workspace = true
nucleo-matcher.workspace = true

tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
# RM-01 direct gateway (the host is Unix-only).
luna-remote.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
luna-mobile = { path = "../mobile" }
tokio-tungstenite.workspace = true
# secret_input.rs captures the whole run at TRACE to prove no log carries a secret.
tracing-subscriber.workspace = true
# In-process registry server for the two-engine workspace integration tests.
luna-sync = { workspace = true, features = ["mock-server"] }
# The GUI app compiles serde_json with `preserve_order` (GPUI enables it), so
# `serde_json::Map` keeps insertion order there but sorts in `-p luna-engine`
# builds. Engine tests must see the app's map semantics: an order-sensitive
# authority hash quarantined the app's own sends (2026-10-06).
serde_json = { workspace = true, features = ["preserve_order"] }

[target.'cfg(unix)'.dev-dependencies]
# remote_access.rs pins the gateway's key the way the phone does.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
x509-parser = "0.18"
# extension_portable.rs (CORE-07) assembles its independently written WAT
# guests into real module bytes; the same version Wasmtime 49.0.2 uses.
wat = "=1.261.0"

[target.'cfg(target_os = "macos")'.dev-dependencies]
mimalloc.workspace = true
