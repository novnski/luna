name: release

# Build release artifacts and publish them:
#   - Linux headless tarballs (x86_64 + aarch64) via scripts/package-linux.sh
#   - macOS dmg (Apple silicon) via scripts/package-macos.sh
# then create a GitHub Release in this repository with artifacts and a signed
# updater manifest. The in-app updater trusts the pinned Ed25519 public key,
# independently of GitHub and the optional Apple code-signing identity.
#
# Trigger: push a tag `v<version>` matching the workspace version in
# Cargo.toml (bump it in the same commit), or run manually via
# workflow_dispatch (builds artifacts without publishing a release).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate product version before building artifacts
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/version.py check
          version="$(python3 scripts/version.py show)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/version.py check --tag "$GITHUB_REF_NAME"
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main
            # A published release is immutable, including workflow reruns.
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/existing-releases.json"
            python3 - "$RUNNER_TEMP/existing-releases.json" "$GITHUB_REF_NAME" <<'PY'
          import json, sys
          releases = [release for page in json.load(open(sys.argv[1])) for release in page]
          if any(release['tag_name'] == sys.argv[2] for release in releases):
              sys.exit('This tag already has a release; bump the version instead of replacing its assets.')
          PY
          fi
          if [[ "$version" == 0.* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04 # x86_64
          - runner: ubuntu-24.04-arm # aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: gpui system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - uses: ./.github/actions/rust-ci
        with:
          cache-group: release
      - name: package
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ runner.arch }}
          path: target/package/*.tar.gz
          if-no-files-found: error

  # Every platform must build before publishing the release and updater manifest.
  #
  # Signing/notarization (both optional — absent secrets fall back to an
  # ad-hoc-signed build):
  #   MACOS_CERT_P12 / MACOS_CERT_PASSWORD — base64 "Developer ID Application"
  #     certificate + private key (.p12) and its export password.
  #   AC_API_KEY_P8 / AC_API_KEY_ID / AC_API_ISSUER_ID — App Store Connect API
  #     key (raw .p8 contents), for notarytool. All three present → the package
  #     script notarizes and staples the app + dmg (no Gatekeeper warning).
  macos:
    needs: validate
    runs-on: macos-latest # Apple silicon
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-ci
        with:
          cache-group: release
      - name: import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -d >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Allow codesign to use the imported key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "p12 contains no Developer ID Application identity"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"
      - name: notary credentials
        if: env.AC_API_KEY_P8 != ''
        run: |
          printf '%s' "$AC_API_KEY_P8" >"$RUNNER_TEMP/ac_api_key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8"
            echo "NOTARY_KEY_ID=$AC_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$AC_API_ISSUER_ID"
          } >>"$GITHUB_ENV"
      - name: package dmg
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ runner.arch }}
          path: |
            target/package/*.dmg
            target/package/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: version guard (tag == artifact version)
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ls release-assets/
          for platform in linux-x86_64.tar.gz linux-aarch64.tar.gz \
              macos-arm64.dmg macos-arm64-app.tar.gz; do
            test -f "release-assets/luna-$ver-$platform" \
              || { echo "missing artifact for tag v$ver: $platform — check builds and Cargo.toml version"; exit 1; }
          done
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - name: updater manifest
        env:
          LUNA_UPDATE_SIGNING_KEY: ${{ secrets.LUNA_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$LUNA_UPDATE_SIGNING_KEY" ]]; then
            echo "LUNA_UPDATE_SIGNING_KEY is required to publish signed updates" >&2
            exit 1
          fi
          private_key="$RUNNER_TEMP/luna-update-signing.pem"
          trap 'rm -f "$private_key"' EXIT
          umask 077
          printf '%s\n' "$LUNA_UPDATE_SIGNING_KEY" > "$private_key"
          python3 -B scripts/create-release-manifest.py \
            --version "$VERSION" --assets release-assets --output release-meta \
            --private-key "$private_key"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
            release-meta/manifest.json
            release-meta/manifest.sig
          generate_release_notes: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.validate.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
