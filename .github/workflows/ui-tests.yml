name: UI tests

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'sdk/**'
      - 'scripts/test-linux-browser.sh'
      - 'scripts/run-macos-browser-fixture.sh'
      - 'dist/macos/Info.plist'
      - 'apps/ios/**'
      - '.github/workflows/ui-tests.yml'
      - '.github/actions/rust-ci/**'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'sdk/**'
      - 'scripts/test-linux-browser.sh'
      - 'scripts/run-macos-browser-fixture.sh'
      - 'dist/macos/Info.plist'
      - 'apps/ios/**'
      - '.github/workflows/ui-tests.yml'
      - '.github/actions/rust-ci/**'
  workflow_dispatch:

permissions:
  contents: read

# Optimized test executables without distribution-time whole-program linking.
# Keep this scoped to CI: release packaging still uses Cargo.toml's thin LTO.
env:
  CARGO_PROFILE_RELEASE_LTO: 'off'
  CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_PROFILE_RELEASE_DEBUG: '0'

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-sync-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-ci
      # The fake Claude/Codex/OpenCode CLI suites own the provider protocol
      # contracts; the 2026-10-09 test audit retired their inline duplicates.
      - name: Provider protocol and permission regressions
        run: |
          cargo test --locked -p luna-harness --lib opencode::
          cargo test --locked -p luna-harness --tests
      - name: Documents, protocol and RPC contracts
        if: ${{ !cancelled() }}
        run: cargo test --locked -p luna-doc -p luna-proto -p luna-rpc
      - name: Published contract matches the code (CORE-01)
        if: ${{ !cancelled() }}
        run: cargo test --locked -p luna-rpc --features schema --test contract
      - name: TypeScript SDK matches the Rust SDK (CORE-05)
        if: ${{ !cancelled() }}
        run: cargo test --locked -p luna-sdk --features schema --test generated
      - name: Direct host and mobile core compile (RM-00)
        if: ${{ !cancelled() }}
        run: cargo check --locked -p luna-remote -p luna-mobile --all-targets
      - name: Durable session publication and recovery
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p luna-sync --features mock-server
          cargo test --locked -p luna-engine --lib --test session_publication --test restart_resume --test codex_subagents --test local_profiles --test timeline_order_e2e
      - name: Engine integration keepers
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p luna-engine --test message_queue --test m5_repos_diffs_terminals \
            --test m5c_accounts_uploads_titles --test workspace_sync --test task_identity \
            --test device_routing --test no_keychain --test local_import \
            --test workspace_identity_repair --test codex_login_resolution --test codex_login_resolver \
            --test backup_restore --test remote_access --test registry_growth_e2e
      # CORE-07 E09: Wasm packages run in the separate portable host process.
      - name: Portable extension host and broker (CORE-07)
        if: ${{ !cancelled() }}
        run: |
          cargo build --locked -p luna-extension-host
          LUNA_EXTENSION_HOST="$PWD/target/debug/luna-extension-host" \
            cargo test --locked -p luna-engine --test extension_portable -- --nocapture
      # CORE-08 E10: an installed provider package in the ordinary registry,
      # picker, run and Stop paths (Python profile-1.0 peer).
      - name: Provider extensions (CORE-08)
        if: ${{ !cancelled() }}
        run: cargo test --locked -p luna-engine --test extension_providers -- --nocapture
      # CORE-11 E11: OpenCode through its first-party provider package (the
      # luna-opencode-worker binary Cargo builds for these targets, scripted
      # OpenCode 2 servers), against the retained in-process baseline.
      - name: OpenCode provider package (CORE-11)
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p luna-engine --test opencode_package_parity \
            --test opencode_package_lifecycle --test board_tools_opencode_package_e2e -- --nocapture
      # CORE-12 E12: UI contributions of installed packages over the real
      # install, enable, update, safe-mode and disable path (Python peer).
      - name: UI contributions (CORE-12)
        if: ${{ !cancelled() }}
        run: cargo test --locked -p luna-engine --test extension_ui -- --nocapture
      # AW-09: read-only storage accounting and engine diagnostics over a
      # disposable profile, checked against an independent walk.
      - name: Diagnostics and storage accounting (AW-09)
        if: ${{ !cancelled() }}
        run: cargo test --locked -p luna-engine --test diagnostics_storage -- --nocapture
      # AW-10: the host turn line over the real send, queue and retry paths,
      # across a restart, with a synthetic provider the test releases.
      - name: Host capacity and recovery controls (AW-10)
        if: ${{ !cancelled() }}
        run: cargo test --locked -p luna-engine --test host_capacity -- --nocapture

  ui-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: GPUI system dependencies
        run: |
          # Only Ubuntu packages are needed; unrelated runner repositories can be out of sync.
          sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - uses: ./.github/actions/rust-ci
      - name: UI and headless layout regressions
        run: cargo test --release --locked -p luna-ui --lib -- --test-threads=1
      # Fixture examples default to `test = false` and their feature is off in
      # the lib run, so they compiled and ran nowhere before CORE-02.
      - name: UI fixtures compile and run their embedded tests (CORE-02)
        if: ${{ !cancelled() }}
        run: |
          cargo check --release --locked -p luna-ui --features appshots-fixture --examples
          cargo test --release --locked -p luna-ui --features appshots-fixture --lib \
            fixture_local_handle_delegates_approval_to_its_synthetic_core -- --test-threads=1
          cargo test --release --locked -p luna-ui --features appshots-fixture \
            --example drafts-fixture --example history-operations-fixture \
            --example task-organization-fixture --example session-history-fixture \
            --example activity-attention-fixture --example child-activity-fixture -- --test-threads=1

  macos-frame-recovery:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-ci
      # A real app build checks linking too and seeds reusable library objects.
      # `cargo check` emits metadata only, which sccache cannot reuse here.
      - name: Build macOS application
        run: cargo build --release --locked -p luna
      - name: Native diff font geometry regression
        run: cargo test --release --locked -p luna-ui --lib native_diff_font_geometry -- --test-threads=1
      - name: Native notification click regressions
        run: |
          cargo test --release --locked -p luna-ui --lib notify::tests:: -- --test-threads=1
      - name: Build native browser fixture
        run: cargo build --release --locked -p luna-ui --example browser-fixture --example preview-fixture --features browser-fixture
      - name: Native browser regression and screenshots
        timeout-minutes: 3
        env:
          RUST_BACKTRACE: 1
        run: |
          bash scripts/run-macos-browser-fixture.sh target/release/examples/browser-fixture "$RUNNER_TEMP/browser-captures"
          test -f "$RUNNER_TEMP/browser-captures/result.txt"
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-macos-captures
          path: ${{ runner.temp }}/browser-captures
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install preview fixture server
        run: npm ci --prefix edge
      - name: Project discovery, stable URLs and HMR in native WebKit
        timeout-minutes: 3
        env:
          LUNA_PREVIEW_AUTO_OPEN: 1
        run: |
          VITE_BINARY="$GITHUB_WORKSPACE/edge/node_modules/vite/bin/vite.js" bash scripts/run-macos-browser-fixture.sh target/release/examples/preview-fixture "$RUNNER_TEMP/preview-captures"
          test -f "$RUNNER_TEMP/preview-captures/result.txt"
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-macos-captures
          path: ${{ runner.temp }}/preview-captures
          if-no-files-found: ignore
      - name: Native frame-source recovery regression
        working-directory: vendor/zui
        run: cargo test --release --locked -p gpui_macos --test frame_source_recovery

  ios-tests:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Simulator CI needs backtraces, not full Rust debugger type information.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-ci
      - name: Rust targets for the owned native client
        run: |
          case "$(uname -m)" in
            arm64) rustup target add aarch64-apple-ios-sim ;;
            x86_64) rustup target add x86_64-apple-ios ;;
          esac
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          iphones = [device for runtime, group in devices.items() if "iOS" in runtime
                     for device in group if device["name"].startswith("iPhone")]
          if not iphones:
              raise SystemExit("No iPhone simulator is installed")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("IOS_SIMULATOR_ID=" + iphones[0]["udid"] + "\n")
          PYTHON
      - name: Run iOS unit tests
        working-directory: apps/ios
        run: |
          xcodebuild -project Luna.xcodeproj -scheme Luna \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            -only-testing:LunaTests CODE_SIGNING_ALLOWED=NO test
      # The build phase regenerated the bindings from the library it linked
      # (IOS-00); a committed copy that differs was compiled against another core.
      - name: Committed Swift bindings match the mobile core
        run: git diff --exit-code -- apps/ios/Luna/Generated/luna_core.swift
      - name: Compiler cache write diagnostics
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'sccache-errors.log'
          lines = log.read_text(errors='replace').lower().splitlines() if log.exists() else []
          # Only counts leave the runner; cache service URLs/tokens stay private.
          categories = ['alreadyexists', 'permissiondenied', 'ratelimited',
                        'too many requests', '409', '403', '429', 'reserve', 'timeout']
          print(json.dumps({'log_lines': len(lines), 'errors': {
              key: sum(key in line for line in lines) for key in categories}}, indent=2))
          PYTHON
      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: ignore

  linux-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Native browser and GPUI dependencies
        run: |
          # Only Ubuntu packages are needed; unrelated runner repositories can be out of sync.
          sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev libfontconfig1-dev \
            libfreetype-dev libasound2-dev libvulkan-dev pkg-config cmake \
            libwebkit2gtk-4.1-dev libjson-glib-dev xvfb xdotool openbox \
            weston ffmpeg imagemagick fonts-noto-cjk
      - uses: ./.github/actions/rust-ci
      - name: Build browser fixture
        run: cargo build --release --locked -p luna-ui --example browser-fixture --features browser-fixture
      - name: X11 and Wayland browser regressions
        timeout-minutes: 5
        env:
          RUST_LOG: gpui_wgpu=info
        run: |
          scripts/test-linux-browser.sh "$RUNNER_TEMP/linux-browser/default"
          VK_DRIVER_FILES=/dev/null scripts/test-linux-browser.sh "$RUNNER_TEMP/linux-browser/opengl"
      - name: Upload native browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-browser
          path: ${{ runner.temp }}/linux-browser
          if-no-files-found: warn
