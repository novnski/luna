[package]
name = "luna"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "luna"
path = "src/main.rs"

[dependencies]
luna-engine.workspace = true
luna-proto.workspace = true
luna-rpc.workspace = true
luna-sdk.workspace = true
luna-ui.workspace = true
luna-update.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The custom allocator is macOS-only (see main.rs): glibc measured flat on the
# same streaming/scroll workloads, so Linux keeps the system allocator.
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
async-trait.workspace = true
futures.workspace = true
tempfile.workspace = true
luna-sync.workspace = true
