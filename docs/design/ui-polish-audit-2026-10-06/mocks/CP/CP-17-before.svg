"3" stroke-linejoin="round" paint-order="stroke">Every fresh chat shows an em-dash</text><text x="346.0" y="138.8" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">label: reads as a glitch / missing</text><text x="346.0" y="153.7" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">value (context_usage.rs:31)</text><line x1="330.0" y1="190.0" x2="342.0" y2="190.0" stroke="#FF453A" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/><circle cx="330.0" cy="190.0" r="9" fill="#FF453A"/><text x="330.0" y="194.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="346.0" y="194.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Ring is 12pt drawn in a 16pt slot,</text><text x="346.0" y="208.8" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">1.8pt stroke on a white-25% track,</text><text x="346.0" y="223.7" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">inside a h24 r6 chip (others h32 r8)</text><text x="40.0" y="262.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#8E8E93" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Tooltip on hover: "Context usage not reported by this harness yet"</text><text x="40.0" y="276.9" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#8E8E93" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">— the explanation exists, the chip just shouldn't announce the absence.</text><text x="40.0" y="300.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#8E8E93" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Rendered in every capture: parity c01–c11, chat-references 01–03,</text><text x="40.0" y="314.9" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#8E8E93" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">goal-card 01–13, queue-image-steer (Claude, Codex, OpenCode).</text>
</svg>