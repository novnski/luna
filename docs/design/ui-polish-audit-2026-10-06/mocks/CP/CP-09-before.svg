" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Blocked (new chat without a project) fades to 35% with no tooltip or reason (integrations editor-composer)</text><line x1="92.0" y1="300.0" x2="104.0" y2="300.0" stroke="#FF453A" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/><circle cx="92.0" cy="300.0" r="9" fill="#FF453A"/><text x="92.0" y="304.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="108.0" y="304.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11.5" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Queue-while-running reuses the Send arrow, so 'send now' vs 'queue' is invisible (composer.rs:12218)</text><text x="40.0" y="350.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="10.5" font-weight="500" fill="#8E8E93" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">composer.rs:634 send_button_mode · :9778 send_blocked · :12196 render_send_button</text>
