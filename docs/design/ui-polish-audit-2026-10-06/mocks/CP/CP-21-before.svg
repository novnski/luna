606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">in a 72pt slot beside icon buttons; tooltips are a separate frosted 10.5pt style (CP-12)</text><line x1="108.2" y1="60.0" x2="120.2" y2="60.0" stroke="#FF453A" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/><circle cx="108.2" cy="60.0" r="9" fill="#FF453A"/><text x="108.2" y="64.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="124.2" y="64.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Thumbnail r5 vs strip r8 (CP-19)</text>
