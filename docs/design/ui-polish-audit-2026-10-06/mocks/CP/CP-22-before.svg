 Geist, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#E8E8EA" text-anchor="start">9m 59s</text><rect x="50.0" y="180.0" width="42.0" height="2.0" rx="1" fill="#FF453A" opacity="0.7" /><text x="50.0" y="198.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#E8E8EA" text-anchor="start">10m 00s</text><rect x="50.0" y="202.0" width="49.0" height="2.0" rx="1" fill="#FF453A" opacity="0.7" /><text x="50.0" y="220.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#E8E8EA" text-anchor="start">11m 11s</text><rect x="50.0" y="224.0" width="45.0" height="2.0" rx="1" fill="#FF453A" opacity="0.7" /><text x="150.0" y="220.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">width changes as digits change ('1' is narrower),</text><text x="150.0" y="234.8" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">so the controls to its right shift each second</text>
