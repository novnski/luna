<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430">
<title>CP-12 after — Five tooltip implementations in one composer</title>
<defs><filter id="shadowMenu" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/></filter><filter id="shadowMenuLight" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1220" flood-opacity="0.16"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0B1220" flood-opacity="0.10"/></filter><filter id="shadowTip" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/></filter><filter id="shadowTipLight" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B1220" flood-opacity="0.12"/></filter><filter id="blur6"><feGaussianBlur stdDeviation="2.2"/></filter><pattern id="hatchRed" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#FF453A" stroke-width="2"/></pattern></defs>
<rect x="0.0" y="0.0" width="720.0" height="430.0" rx="0" fill="#111113" />
<rect x="16.0" y="14.0" width="62.0" height="20.0" rx="10" fill="#30D158" opacity="0.16" /><rect x="16.0" y="14.0" width="62.0" height="20.0" rx="10" fill="none" stroke="#30D158" stroke-width="1" />
<text x="47.0" y="28.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#30D158" text-anchor="middle" letter-spacing="0.6">AFTER</text>
<text x="88.0" y="28.0" font-family="'SF Mono', 'Geist Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#8E8E93" text-anchor="start">CP-12</text>
<text x="125.9" y="28.5" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#F2F2F7" text-anchor="start">Five tooltip implementations in one composer</text>
<text x="704.0" y="28.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#8E8E93" text-anchor="end">Luna Dark</text>
<rect x="12.0" y="46.0" width="696.0" height="372.0" rx="14" fill="#060606" stroke="#1C1C1E" stroke-width="1" />
<text x="40.0" y="72.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#E8E8EA" text-anchor="start">popover::tooltip(title, detail) — the only tooltip</text><g filter="url(#shadowTip)"><rect x="40.0" y="90.0" width="86.0" height="29.6" rx="8" fill="#262627" stroke="#3A3A3C" stroke-width="1" /></g><text x="50.0" y="109.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#E8E8EA" text-anchor="start">Steer now</text><g filter="url(#shadowTip)"><rect x="150.0" y="90.0" width="150.0" height="47.5" rx="8" fill="#262627" stroke="#3A3A3C" stroke-width="1" /></g><text x="160.0" y="109.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#E8E8EA" text-anchor="start">Sonnet 5.5</text><text x="160.0" y="128.5" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#8C8C8D" text-anchor="start">Low · 200K · Standard</text><g filter="url(#shadowTip)"><rect x="326.0" y="90.0" width="196.0" height="26.0" rx="8" fill="#262627" stroke="#3A3A3C" stroke-width="1" /></g><text x="336.0" y="107.0" font-family="'SF Mono', 'Geist Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#8C8C8D" text-anchor="start">crates/ui/src/queue.rs</text><g filter="url(#shadowTip)"><rect x="546.0" y="90.0" width="136.0" height="65.5" rx="8" fill="#262627" stroke="#3A3A3C" stroke-width="1" /></g><text x="556.0" y="109.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#E8E8EA" text-anchor="start">Context window</text><text x="556.0" y="128.5" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#8C8C8D" text-anchor="start">Context usage not</text><text x="556.0" y="144.5" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#8C8C8D" text-anchor="start">reported yet</text><circle cx="48.0" cy="192.0" r="2" fill="#30D158"/><text x="58.0" y="196.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#E8E8EA" text-anchor="start">Shape: radius 8 · padding 10 × 6 · max width 260 then wrap</text><circle cx="48.0" cy="216.0" r="2" fill="#30D158"/><text x="58.0" y="220.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#E8E8EA" text-anchor="start">Fill: opaque tooltip_surface · hairline white 12% (not the hardened #949495 ring)</text><circle cx="48.0" cy="240.0" r="2" fill="#30D158"/><text x="58.0" y="244.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#E8E8EA" text-anchor="start">Shadow: 0 4 12 rgba(0,0,0,.35) dark / .12 light — one step below menus</text><circle cx="48.0" cy="264.0" r="2" fill="#30D158"/><text x="58.0" y="268.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#E8E8EA" text-anchor="start">Type: title 12/600 text · detail 11/400 muted · mono variant only for paths</text><circle cx="48.0" cy="288.0" r="2" fill="#30D158"/><text x="58.0" y="292.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#E8E8EA" text-anchor="start">Timing: 400ms first show · 0ms while warm (&lt;1s) · 120ms fade (FADE_QUICK)</text><circle cx="48.0" cy="312.0" r="2" fill="#30D158"/><text x="58.0" y="316.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#E8E8EA" text-anchor="start">Placement: anchored above the trigger, centred, 6pt gap (CP-02)</text><line x1="48.0" y1="350.0" x2="60.0" y2="350.0" stroke="#30D158" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/><circle cx="48.0" cy="350.0" r="9" fill="#30D158"/><text x="48.0" y="354.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="64.0" y="354.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#4CDB76" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">ControlTooltip, QueueActionTooltip, AppshotActionTooltip, MentionPathTooltip</text><text x="64.0" y="368.9" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#4CDB76" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">and UsageCard all become thin wrappers over this one helper</text>
</svg>