ejoin="round" paint-order="stroke">ring) even when it does not fit</text><text x="440.0" y="140.6" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">(composer.rs:477–520)</text><text x="440.0" y="182.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#8E8E93" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">composer-parity-fixture, 300pt pane:</text><text x="440.0" y="196.8" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#8E8E93" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">"pane controls row needs 100.0px</text><text x="440.0" y="211.7" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#8E8E93" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">but has 98.0px" → exit 1</text><line x1="66.6" y1="301.2" x2="436.0" y2="246.0" stroke="#FF453A" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/><circle cx="66.6" cy="301.2" r="9" fill="#FF453A"/><text x="66.6" y="305.2" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="440.0" y="250.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">controls_row_fits() only checks</text><text x="440.0" y="264.9" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">2×32 + 4 = 68pt, so the compact tray</text><text x="440.0" y="279.7" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">never takes over; the row squeezes</text><text x="440.0" y="294.6" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">the model chip by 2pt instead</text>
