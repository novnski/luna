="'SF Mono', 'Geist Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#8E8E93" text-anchor="middle">t = 180ms</text><rect x="138.0" y="82.0" width="110.0" height="106.0" rx="12" fill="none" stroke="#FF453A" stroke-width="1.5" stroke-dasharray="5 3" /><text x="500.0" y="72.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11.5" font-weight="600" fill="#E8E8EA" text-anchor="start">Hover: .hover(opacity 0.85)</text><rect x="500.0" y="86.0" width="188.0" height="98.0" rx="8" fill="#0D0D0E" stroke="#2A2A2C" stroke-width="1" /><path d="M512 110 H590 V150 H676" fill="none" stroke="#FF6B61" stroke-width="2" stroke-linecap="round" stroke-linejoin="miter"/><text x="512.0" y="104.0" font-family="'SF Mono', 'Geist Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#8E8E93" text-anchor="start">1.0</text><text x="512.0" y="166.0" font-family="'SF Mono', 'Geist Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#8E8E93" text-anchor="start">0.85</text><text x="594.0" y="178.0" font-family="'SF Mono', 'Geist Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#8E8E93" text-anchor="middle">pointer enters</text><line x1="194.0" y1="240.0" x2="206.0" y2="240.0" stroke="#FF453A" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/><circle cx="194.0" cy="240.0" r="9" fill="#FF453A"/><text x="194.0" y="244.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="210.0" y="244.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11.5" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">composer-send / composer-stop are different element ids: the arrow is replaced by</text><text x="210.0" y="259.5" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11.5" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">the square in one frame (composer.rs:12206–12245)</text><line x1="194.0" y1="286.0" x2="206.0" y2="286.0" stroke="#FF453A" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/><circle cx="194.0" cy="286.0" r="9" fill="#FF453A"/><text x="194.0" y="290.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="210.0" y="290.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11.5" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Hover jumps to 85% opacity instantly while every chip beside it fades over 150ms;</text><text x="210.0" y="305.5" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11.5" font-weight="500" fill="#FF6B61" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">no pressed state, so a click has no tactile acknowledgement</text>
