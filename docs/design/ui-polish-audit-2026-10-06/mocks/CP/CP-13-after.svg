ne" stroke="#8C8C8D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 3.5V8h4" fill="none" stroke="#8C8C8D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66.0" y="179.5" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#E8E8EA" text-anchor="start">popover.rs</text><text x="148.0" y="179.5" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#8C8C8D" text-anchor="start">crates/ui/src</text></g><rect x="36.0" y="193.0" width="322.0" height="33.0" rx="8" fill="#1A1A1A" /><g opacity="1"><g transform="translate(44.0,202.5) scale(0.5833)"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10.5a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5Z" fill="none" stroke="#8C8C8D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 3.5V8h4" fill="none" stroke="#8C8C8D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66.0" y="214.5" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#E8E8EA" text-anchor="start">pickers.rs</text><text x="148.0" y="214.5" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#8C8C8D" text-anchor="start">crates/ui/src</text></g><g transform="translate(220,200) scale(1.0)"><path d="M0 0 L0 15 L4 11.5 L6.8 17.5 L9 16.5 L6.3 10.6 L11.2 10.6 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-linejoin="round"/></g><line x1="372.0" y1="200.0" x2="384.0" y2="200.0" stroke="#30D158" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/><circle cx="372.0" cy="200.0" r="9" fill="#30D158"/><text x="372.0" y="204.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="388.0" y="204.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#4CDB76" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Pointer and arrows share `active`;</text><text x="388.0" y="218.8" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#4CDB76" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">active wash white 8% (#1A1A1A);</text><text x="388.0" y="233.7" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#4CDB76" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">only one row is ever lit</text><text x="32.0" y="262.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11.5" font-weight="600" fill="#E8E8EA" text-anchor="start">Access menu on open</text><g><rect x="32.0" y="274.0" width="330.0" height="82.0" rx="12" fill="#0B0B0B" stroke="#1F1F1F" stroke-width="1" /></g><text x="46.0" y="296.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#E8E8EA" text-anchor="start" opacity="0.48">Approve for me</text><text x="46.0" y="309.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#85858A" text-anchor="start" opacity="0.6">Unavailable: no verified Auto reviewer.</text><rect x="36.0" y="318.0" width="322.0" height="36.0" rx="8" fill="#1A1A1A" /><text x="46.0" y="337.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#E8E8EA" text-anchor="start">Full access</text><g transform="translate(334.0,326.0) scale(0.5833)"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#E8E8EA" stroke-width="2.742857142857143" stroke-linecap="round" stroke-linejoin="round"/></g><text x="46.0" y="350.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#8C8C8D" text-anchor="start">Skip approval prompts; OS controls still apply.</text><line x1="372.0" y1="330.0" x2="384.0" y2="330.0" stroke="#30D158" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/><circle cx="372.0" cy="330.0" r="9" fill="#30D158"/><text x="372.0" y="334.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="388.0" y="334.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#4CDB76" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Cursor starts on the current choice,</text><text x="388.0" y="348.9" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#4CDB76" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">arrows skip disabled rows; selection</text><text x="388.0" y="363.7" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#4CDB76" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">= trailing check, not a second wash</text>
