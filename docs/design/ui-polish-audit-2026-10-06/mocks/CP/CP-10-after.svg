ssfade</text><line x1="194.0" y1="296.0" x2="206.0" y2="296.0" stroke="#30D158" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/><circle cx="194.0" cy="296.0" r="9" fill="#30D158"/><text x="194.0" y="300.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="210.0" y="300.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11.5" font-weight="500" fill="#4CDB76" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Hover via hover_blend (HOVER_FADE 150ms) to 88%; pressed → 76% + 0.96 glyph scale</text>
