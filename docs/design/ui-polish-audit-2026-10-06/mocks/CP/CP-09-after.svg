t x="92.0" y="276.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="108.0" y="276.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11.5" font-weight="500" fill="#4CDB76" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Blocked uses the same recessed look and explains itself (anchored tooltip, CP-02)</text><line x1="92.0" y1="300.0" x2="104.0" y2="300.0" stroke="#30D158" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/><circle cx="92.0" cy="300.0" r="9" fill="#30D158"/><text x="92.0" y="304.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="108.0" y="304.0" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11.5" font-weight="500" fill="#4CDB76" text-anchor="start" stroke="#060606" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Queue gets its own glyph so a running turn never looks like an immediate send</text>
