<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270"><rect width="720" height="270" fill="#141416"/><rect x="0" y="0" width="720" height="34" rx="0" fill="#000000" fill-opacity="0" /><rect x="12" y="9" width="52" height="17" rx="4" fill="#FF453A" fill-opacity="0.18" /><text x="16" y="21.5" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#FF453A" letter-spacing="0.6">BEFORE</text><text x="74" y="22" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#f2f2f2">SH-21 · Two tooltip styles, three delays</text><text x="708" y="22" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="10.5" font-weight="500" fill="#737373" text-anchor="end">Luna Dark</text><text x="30" y="64" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#e5e5e5">SurfaceTabTooltip (rows, footer, pins)</text><rect x="30" y="80" width="112" height="26" rx="6" fill="#1d1d1e" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" /><text x="39" y="97" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#a1a1a1">Archive task</text><text x="30" y="128" font-family="'SF Mono', 'Geist Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#FF453A">r6 · pad 9/6 · 10.5px muted · border,</text><text x="30" y="142" font-family="'SF Mono', 'Geist Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#FF453A">no shadow · delay 350ms (12 sites)</text><text x="380" y="64" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#e5e5e5">ControlTooltip (tabs, strip, breadcrumb)</text><rect x="380" y="84" width="250" height="50" rx="8" fill="#1d1d1e" /><rect x="380" y="80" width="250" height="50" rx="8" fill="#1d1d1e" stroke="#ffffff" stroke-width="1" stroke-opacity="0.06" /><text x="390" y="99" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#e5e5e5">New thread in a split  ⌘⇧D</text><text x="390" y="117" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#a1a1a1">A fresh thread from this group's chat…</text><text x="380" y="152" font-family="'SF Mono', 'Geist Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#FF453A">r8 · pad 10/7 · 12px + 11px · shadow_md ·</text><text x="380" y="166" font-family="'SF Mono', 'Geist Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#FF453A">delay 400ms (9 sites)</text><text x="30" y="196" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#a1a1a1">Row detail card: tooltip_at(), delay 300ms (3 sites) — pops while scanning the sidebar</text><line x1="380" y1="222" x2="380" y2="106" stroke="#FF453A" stroke-width="1.25" stroke-linecap="round"/><circle cx="380" cy="106" r="2.8" fill="#FF453A"/><rect x="30" y="222" width="560" height="38" rx="6" fill="#0b0b0c" fill-opacity="0.94" stroke="#FF453A" stroke-width="1.25" /><text x="39" y="237.5" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="10.5" font-weight="600" fill="#FF453A">Sibling controls in one strip (row pin vs tab +) show different cards after different</text><text x="39" y="252" font-family="-apple-system, 'SF Pro Text', Geist, Helvetica, sans-serif" font-size="10.5" font-weight="600" fill="#FF453A">waits; moving between controls re-waits the full delay each time.</text></svg>