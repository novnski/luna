<style>

<div id="luna-board-lifecycle" aria-label="LUNA Board start, stop, resume and reviewer cleanup preview"></div>
<script>
(()=>{
const root=document.getElementById('luna-board-lifecycle');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const button=(label,action,id='',style='',extra='')=>`<button type="button" class="lb-button ${style}" data-action="${action}" ${id!==''?`data-id="${id}"`:''} ${extra}>${label}</button>`;
const catalog={'Codex':['GPT-6.1 Sol','GPT-6 Luna'],'Claude Code':['Opus 5.5','Sonnet 5'],'OpenCode':['Project default']};
const baseProfile={harness:'Codex',model:'GPT-6.1 Sol',effort:'High',access:'Auto'};
const baseAuthor={harness:'Claude Code',model:'Opus 5.5',effort:'High',access:'Ask'};
const seed={version:3,page:'board',selected:41,chatId:'planning',toast:'',draftTitle:'',draftBody:'',draftMode:'manual',ticketProfile:structuredClone(baseProfile),authorProfile:structuredClone(baseAuthor),draftReview:'Opus 5.5',authorMessages:[],candidate:null,profileConfirmed:false,authorSaved:null,boardDraft:null,chatReceipts:{},query:'',tickets:[
 {id:42,title:'Include archived projects in search',body:'Respect the Include archived toggle. Find matching archived projects when it is enabled and preserve the current results when disabled.',column:'Backlog',phase:'Not started',worker:null,reviewer:null,starts:0,resumes:0,generation:0,intent:0,build:'Codex',review:'Opus 5.5',instructions:[]},
 {id:43,title:'Make ticket links keyboard accessible',body:'Let keyboard users open a ticket from its chat badge and return to the same conversation without losing their draft.',column:'Backlog',phase:'Not started',worker:null,reviewer:null,starts:0,resumes:0,generation:0,intent:0,build:'Claude Code',review:'Opus 5.5',instructions:[]},
 {id:41,title:'Restore sessions after reconnect',body:'Reconnect to the existing session without replaying the last prompt. Preserve the unsent draft and the selected side chat.',column:'Ready',phase:'Reviewing',worker:'work-41',reviewer:'review-41',starts:1,resumes:0,generation:1,intent:1,build:'Codex',review:'Opus 5.5',instructions:[{kind:'Start',text:'Work on LUN-41. Preserve unrelated changes, implement the reconnect fix, run the required checks and use the configured reviewer.'}]},
 {id:44,title:'Remember board filters',body:'Restore the selected project and board filters when the app reopens.',column:'Ready',phase:'Working',worker:'work-44',reviewer:null,starts:1,resumes:0,generation:1,intent:1,build:'Codex',review:'Opus 5.5',instructions:[{kind:'Start',text:'Work on LUN-44. Implement persistent board filters, verify restart behavior and request the configured review.'}]},
 {id:39,title:'Keep chat titles consistent',body:'Keep the ticket title and primary working-chat title synchronized.',column:'Done',phase:'Complete',worker:'work-39',reviewer:'review-39',starts:1,resumes:0,generation:1,intent:1,build:'Claude Code',review:'Opus 5.5',reviewPassed:true,instructions:[]}
],chats:[
 {id:'planning',title:'Release planning',role:'main',ticket:null},
 {id:'work-44',title:'Remember board filters',role:'main',ticket:44},
 {id:'work-41',title:'Restore sessions after reconnect',role:'side',parent:'planning',ticket:41},
 {id:'review-41',title:'Review · LUN-41',role:'side',parent:'planning',reviewFor:41,owner:'work-41',status:'Running',generation:1,model:'Opus 5.5',archived:false},
 {id:'work-39',title:'Keep chat titles consistent',role:'side',parent:'planning',ticket:39},
 {id:'review-39',title:'Review · LUN-39',role:'side',parent:'planning',reviewFor:39,owner:'work-39',status:'Passed',generation:1,model:'Opus 5.5',archived:true,closed:true}
]};
let state=structuredClone(seed),lastPublished=null,draggedId=null;
const timers=new Map();
const ticket=id=>state.tickets.find(t=>t.id===Number(id));
const chat=id=>state.chats.find(c=>c.id===id);
const key=t=>`LUN-${t.id}`;
const current=()=>ticket(state.selected)||state.tickets[0];
const iconize=()=>{if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});};
const note=text=>{state.toast=text;};
function restore(v){const p=v?.privateContent;if(p?.version===3&&Array.isArray(p.tickets)&&Array.isArray(p.chats))state={...structuredClone(seed),...p,toast:''};}
restore(window.openai?.widgetState);
function persist(){if(!window.openai?.setWidgetState)return;const copy=structuredClone(state);lastPublished=JSON.stringify(copy);if(new TextEncoder().encode(lastPublished).length>14000)return;window.openai.setWidgetState({modelContent:{screen:state.page,authoringMode:state.page==='draft'?state.draftMode:null,implementationProfile:state.page==='draft'?state.ticketProfile:null,selectedTicket:key(current()),ticketStates:state.tickets.map(t=>({id:key(t),column:t.column,phase:t.phase,starts:t.starts,resumes:t.resumes})),archivedReviewers:state.chats.filter(c=>c.reviewFor&&c.archived).length},privateContent:copy}).catch(()=>{});}
function commit(){render();persist();}
function mainFor(t){const c=chat(t.worker);return c?.role==='side'?c.parent:c?.id;}
function sideCount(id){return state.chats.filter(c=>c.role==='side'&&c.parent===id&&!c.archived).length;}
function badge(t,review=false){return button(ico(review?'scan-search':'ticket')+`${review?'Review · ':''}${key(t)}`,'ticket',t.id,'soft');}
function sidebar(){return `<aside class="lb-side"><div class="lb-brand">${ico('moon')}LUNA</div><button class="lb-nav lb-new-nav" data-action="new-main">${ico('square-pen')}New chat<span class="lb-key">⌘ N</span></button><button class="lb-nav" data-action="automations">${ico('calendar-clock')}Automations</button><button class="lb-nav ${state.page!=='chat'?'active':''}" data-action="board">${ico('columns-3')}Board<span class="lb-key">${state.tickets.length}</span></button><div class="lb-side-label">Luna</div>${state.chats.filter(c=>c.role==='main'&&!c.archived).map(c=>`<button class="lb-thread ${state.page==='chat'&&(state.chatId===c.id||chat(state.chatId)?.parent===c.id)?'active':''}" data-action="chat" data-id="${c.id}" data-tooltip="${esc(c.title)}">${ico(c.ticket?'ticket':'message-square')}<span class="lb-thread-text"><span class="lb-thread-title">${esc(c.title)}</span><span class="lb-thread-meta">${c.ticket?'LUN-'+c.ticket+' · ':''}${sideCount(c.id)?sideCount(c.id)+' side chats':'Main chat'}</span></span></button>`).join('')}<div class="lb-side-foot"><span class="lb-avatar">I</span><span>Iulian<br>Personal workspace</span></div></aside>`;}
function card(t){const c=chat(t.worker);return `<article class="lb-ticket" draggable="true" data-ticket="${t.id}" aria-label="${key(t)} ${esc(t.title)}"><div class="lb-ticket-top">${ico('ticket')}${key(t)}<span style="margin-left:auto">${ico('grip-vertical')}</span></div><button class="lb-card-open" data-action="ticket" data-id="${t.id}">${esc(t.title)}</button><p class="lb-ticket-summary">${esc(t.body)}</p><div class="lb-phase"><span class="lb-status-mark ${t.column==='Done'?'done':t.column==='Ready'?'progress':'ready'}"></span>${esc(t.phase)}</div>${t.reviewer?`<div class="lb-reviewer">${ico('scan-search')}${t.reviewPassed?'Review passed · archived':t.phase==='Reviewing'?t.review+' reviewing':'Reviewer retained'}</div>`:''}<div class="lb-location"><div class="lb-location-line">${ico(!c?'circle-dashed':c.role==='main'?'message-square':'corner-down-right')}${!c?'No chat yet':c.role==='main'?'Main chat':'Side chat'}</div>${c?.role==='side'?`<small>${esc(chat(c.parent)?.title||'Main parent')}</small>`:''}</div><div class="lb-card-action">${t.column==='Backlog'?button(ico('play')+(t.starts?' Resume':' Start'),'ready',t.id):t.column==='Ready'?button(ico('square')+' Stop','backlog',t.id):button('Review details','review-details',t.id,'ghost')}<span class="lb-key">${t.starts&&t.column==='Backlog'?'Same chat on resume':''}</span></div></article>`;}
function board(){const visible=state.tickets.filter(t=>!state.query||`${key(t)} ${t.title}`.toLowerCase().includes(state.query.toLowerCase()));return `<div class="lb-heading"><div class="lb-grow"><h1>Board</h1><div class="lb-subtitle">Move to Ready to start. Move back to stop.</div></div>${button(ico('plus')+' New ticket','new-ticket','','primary')}</div><div class="lb-toolbar"><span class="lb-tag">${ico('folder')}Luna</span><label class="lb-search">${ico('search')}<input data-field="query" value="${esc(state.query)}" placeholder="Search tickets…" aria-label="Search tickets"></label><span class="lb-toolbar-end lb-subtitle">${ico('scan-search')} Automatic agent review</span></div><div class="lb-board">${['Backlog','Ready','Done'].map((col,i)=>`<section class="lb-col" data-drop="${col}" aria-label="${col}"><div class="lb-col-heading"><span class="lb-status-mark ${['ready','progress','done'][i]}"></span>${col}<span class="lb-count">${visible.filter(t=>t.column===col).length}</span></div><div class="lb-col-hint">${['Held or stopped','Runs automatically','Verified and reviewed'][i]}</div>${visible.filter(t=>t.column===col).map(card).join('')||'<div class="lb-empty-col">Drop a ticket here</div>'}</section>`).join('')}</div><div class="lb-board-foot"><span>${ico('corner-down-right')}Reviewers are temporary side chats</span><span>${ico('archive')}Closed and archived after success</span></div>`;}
function details(){const t=current(),c=chat(t.worker),r=chat(t.reviewer);return `<div class="lb-breadcrumb">${button(ico('arrow-left')+' Board','board','','ghost')} / ${key(t)}</div><div class="lb-detail-head"><div><span class="lb-tag ${t.column==='Done'?'good':t.column==='Ready'?'running':''}">${esc(t.column)} · ${esc(t.phase)}</span><h2>${esc(t.title)}</h2><div class="lb-subtitle">${c?'One working chat, preserved across stops':'No working chat until you move this to Ready'}</div></div></div><div class="lb-detail-grid"><div><section class="lb-section"><div class="lb-section-title">Description</div><p class="lb-bodytext">${esc(t.body)}</p></section><section class="lb-section"><div class="lb-section-title">Working chat</div>${c?`<button class="lb-worklink" data-action="chat" data-id="${c.id}">${ico(c.role==='side'?'corner-down-right':'message-square')}<span>${esc(c.title)}<small>${c.role==='main'?'Main chat in the sidebar':'Side chat in '+esc(chat(c.parent)?.title)}</small></span>${ico('arrow-up-right')}</button>`:'<p class="lb-subtitle">A first start from Board creates a new main chat.</p>'}</section><section class="lb-section"><div class="lb-section-title">Review</div>${r?`<button class="lb-worklink" data-action="chat" data-id="${r.id}">${ico('scan-search')}<span>${esc(r.title)}<small>${r.archived?'Passed · closed and archived':r.status+' · side chat in '+esc(chat(r.parent)?.title)}</small></span>${ico(r.archived?'archive':'arrow-up-right')}</button><p class="lb-state-note">${r.archived?'Review history is preserved. Opening it does not restart or unarchive the reviewer.':'Reports back to '+key(t)+'. The reviewer closes and archives only after review and ticket success.'}</p>`:`<p class="lb-subtitle">${esc(t.review)} will review the changes in a temporary side chat.</p>`}</section><details class="lb-instruction"><summary>Dispatch history · ${t.starts} start · ${t.resumes} continuation${t.resumes===1?'':'s'}</summary>${t.instructions.map(x=>`<p><strong>${esc(x.kind)}</strong><br>${esc(x.text)}</p>`).join('<br>')||'<p>No execution instruction sent.</p>'}</details></div><aside><div class="lb-property"><span>Implement with</span><span>${esc(t.build)}</span></div><div class="lb-property"><span>Review with</span><select class="lb-select" aria-label="Review model" data-field="review"><option ${t.review==='Opus 5.5'?'selected':''}>Opus 5.5</option><option ${t.review==='Project default'?'selected':''}>Project default</option></select></div><div class="lb-property"><span>Reasoning</span><span>High</span></div><div class="lb-property"><span>Completion</span><span>Automatic</span></div><div class="lb-launch"><h3>${t.column==='Backlog'?(t.starts?'Continue when ready':'Start when ready'):t.column==='Done'?'Work completed':'Ready means enabled'}</h3><p>${t.column==='Backlog'?(t.starts?'Your chat and partial work are kept. The next instruction continues the work.':'Moving to Ready creates the chat and sends the first instruction.') :t.column==='Done'?'Checks and review passed. The primary chat stays available.':'Move back to Backlog to use the same Stop action as the chat.'}</p>${t.column==='Backlog'?button(ico('play')+(t.starts?' Move to Ready & continue':' Move to Ready & start'),'ready',t.id,'primary'):t.column==='Ready'?button(ico('square')+' Stop & move to Backlog','backlog',t.id):button('Reopen in Backlog','backlog',t.id)}</div></aside></div>`;}
function conversation(){const c=chat(state.chatId);if(!c)return board();const main=c.role==='side'?chat(c.parent):c;const t=ticket(c.ticket||c.reviewFor);const siblings=state.chats.filter(x=>x.parent===main.id&&!x.archived);return `<div class="lb-chat-head"><div class="lb-chat-head-top"><h2>${esc(main.title)}</h2>${button(ico('columns-3')+' Board','board','','ghost')}</div><div class="lb-chat-tabs"><button class="lb-chat-tab ${c.id===main.id?'active':''}" data-action="chat" data-id="${main.id}">Main</button>${siblings.map(s=>`<button class="lb-chat-tab ${s.id===c.id?'active':''}" data-action="chat" data-id="${s.id}" data-tooltip="${esc(s.title)}">${ico(s.reviewFor?'scan-search':s.ticket?'ticket':'message-square')}<span class="lb-tab-label">${esc(s.title)}</span></button>`).join('')}</div></div><div class="lb-chat-context">${t?badge(t,!!c.reviewFor):'<span>Main chat · coordinator</span>'}${c.archived?'<span class="lb-tag good">Archived review · read only</span>':c.reviewFor?`<span>Reviewer · ${esc(t.review)}</span>`:t?`<span>${esc(t.phase)}</span>`:''}</div><div class="lb-messages">${c.reviewFor?`<div class="lb-message"><div class="lb-message-label">Review brief</div><p class="lb-bodytext">Review ${key(t)} against its acceptance criteria and the current diff. Inspect the verification evidence, report concrete findings, and do not edit the implementation.</p></div><div class="lb-message"><div class="lb-message-label">${ico('scan-search')}${esc(t.review)}</div><p class="lb-bodytext">${c.status==='Passed'?'Review passed for the recorded revision. Required checks and acceptance criteria passed. The result was returned to the ticket before this reviewer was closed and archived.':c.status==='Stopped'?'Review stopped with the ticket. This conversation and its partial findings are retained.':'Reviewing the current changes and check results. Findings will be returned to the ticket’s working chat.'}</p></div>`:t?`${t.instructions.slice(-3).map(x=>`<div class="lb-message user"><div class="lb-message-label">${esc(x.kind)} instruction · from Board</div><p class="lb-bodytext">${esc(x.text)}</p></div>`).join('')}<div class="lb-receipt">${ico(t.phase==='Stopped'?'square':t.column==='Done'?'check-circle-2':'activity')}<div>${esc(t.phase)}<small>${t.resumes?'Continuing the same conversation.':t.column==='Done'?'Review result preserved on the ticket.':'Progress belongs to this ticket.'}</small></div>${button('Open ticket','ticket',t.id,'ghost')}</div>${t.reviewer?`<div class="lb-receipt">${ico('scan-search')}<div>${chat(t.reviewer)?.archived?'Reviewer archived':'Reviewer side chat'}<small>${esc(chat(t.reviewer)?.title||'')}</small></div>${button('Review details','review-details',t.id,'ghost')}</div>`:''}`:`<div class="lb-message user"><div class="lb-message-label">You</div><p class="lb-bodytext">Work on the reconnect ticket in a side chat and keep its review together with this project.</p></div><div class="lb-message"><div class="lb-message-label">Agent</div><p class="lb-bodytext">The ticket and its reviewer are sibling side chats here. The reviewer reports to the ticket and is archived after success.</p></div>`}</div>${c.archived?'':`<div class="lb-chat-actions">${t&&!c.reviewFor?(t.column==='Ready'?button(ico('square')+' Stop','backlog',t.id):t.column==='Backlog'?button(ico('play')+' Continue','ready',t.id):''):''}${t?button(ico('ticket')+' Open ticket','ticket',t.id):''}</div>`}`;}
function profileFields(p,scope){
 const prefix=scope==='ticket'?'Implementation':'Discussion';
 const control=(label,k,values)=>`<label>${label}<select class="lb-select" aria-label="${prefix} ${label.toLowerCase()}" data-profile="${scope}" data-key="${k}">${values.map(v=>`<option ${p[k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`;
 return `<div class="lb-config-grid">${control('Harness','harness',Object.keys(catalog))}${control('Model','model',catalog[p.harness]||catalog.Codex)}${control('Reasoning','effort',p.harness==='OpenCode'?['Default']:['Low','Medium','High'])}${control('Access','access',['Ask','Auto','Full'])}</div>`;

function authoring(){
 const initial='Tell me what is happening and what should happen instead. We can inspect the Luna project while we work out the ticket. Before saving, I’ll ask which model, reasoning and access you want for implementation.';
 const c=state.candidate,p=state.ticketProfile;
 return `<div class="lb-author"><div class="lb-author-header"><span class="lb-tag">${ico('message-square')}Temporary discussion</span><span class="lb-tag">${ico('folder')}Luna project attached</span></div><div class="lb-author-messages"><div class="lb-message"><div class="lb-message-label">Ticket assistant</div><p class="lb-bodytext">${initial}</p></div>${state.authorMessages.map(m=>`<div class="lb-message ${m.role==='user'?'user':''}"><div class="lb-message-label">${m.role==='user'?'You':'Ticket assistant'}</div><p class="lb-bodytext">${esc(m.text)}</p></div>`).join('')}${c&&!state.authorSaved?`<div class="lb-proposed-ticket"><div class="lb-ai-label">${ico('ticket')}Proposed ticket · read only</div><h3>${esc(c.title)}</h3><p class="lb-bodytext">${esc(c.body)}</p><p class="lb-state-note">Implement: ${esc(profileText(p))}<br>Review: ${esc(state.draftReview)}</p><span class="lb-subtitle">Tell the assistant what to change.</span></div>`:''}${c&&!state.profileConfirmed&&!state.authorSaved?`<div class="lb-author-options">${button('Use project defaults','author-defaults')}${button('Use Claude Code · High · Ask','author-claude')}</div>`:''}${state.authorSaved?`<div class="lb-receipt">${ico('ticket')}<div>LUN-${state.authorSaved} saved to Backlog<small>No working chat created. This temporary discussion can now close.</small></div>${button('Open ticket','ticket',state.authorSaved)}</div>`:''}</div>${state.authorSaved?`<div class="lb-draft-actions">${button('Close discussion','close-draft','','primary')}</div>`:`<details class="lb-instruction"><summary>Discussion assistant: ${esc(profileText(state.authorProfile))}</summary>${profileFields(state.authorProfile,'author')}<p class="lb-subtitle">These settings affect this temporary discussion, not the future ticket worker.</p></details><div class="lb-composer"><textarea data-field="draftPrompt" aria-label="Message temporary assistant" placeholder="Explain the issue, add details, or choose execution settings…">${esc(state.draftPrompt||'')}</textarea><div class="lb-composer-bottom"><span class="lb-subtitle">${ico('folder')}Project context available</span><span class="lb-spacer"></span>${button(ico('arrow-up'),'author-send','','primary','aria-label="Send to temporary assistant"')}</div></div><div class="lb-author-hint">This discussion never appears in chats, Settled or Archive. Closing keeps only an unfinished Board draft.</div><div class="lb-draft-actions">${button('Discard discussion','discard-draft')}${button('Create ticket','author-save','','primary',c&&state.profileConfirmed?'':'disabled')}</div>`}</div>`;

function draft(){return `<div class="lb-breadcrumb">${button(ico('arrow-left')+' Close','close-draft','','ghost')} / New ticket</div><div class="lb-heading"><div><h2>${state.draftMode==='ai'?'Discuss the ticket':'Create a ticket'}</h2><p class="lb-subtitle">${state.draftMode==='ai'?'A temporary, project-aware conversation':'Write the brief and choose how the ticket will run'}</p></div></div><div class="lb-draft"><div class="lb-draft-tabs"><button class="lb-draft-tab ${state.draftMode==='manual'?'active':''}" data-action="manual">Write manually</button><button class="lb-draft-tab ${state.draftMode==='ai'?'active':''}" data-action="ai">Discuss with AI</button></div></div>${state.draftMode==='ai'?authoring():`<div class="lb-draft"><label class="lb-field">Title<input data-field="draftTitle" value="${esc(state.draftTitle)}" placeholder="A clear outcome"></label><label class="lb-field">Description<textarea data-field="draftBody" placeholder="What should change, and how will we know it works?">${esc(state.draftBody)}</textarea></label><div class="lb-section-title">Ticket execution · project defaults shown</div>${profileFields(state.ticketProfile,'ticket')}<label class="lb-field">Review model<select class="lb-select" aria-label="Ticket review model" data-field="draftReview">${['Opus 5.5','Project default'].map(v=>`<option ${state.draftReview===v?'selected':''}>${v}</option>`).join('')}</select></label><p class="lb-state-note">Access applies to the ticket worker. Review uses the project's review-access policy.</p><div class="lb-draft-actions">${button('Save to Backlog','save-ticket','','primary')}</div></div>`}`;}
function clearDraft(){state.draftTitle='';state.draftBody='';state.draftPrompt='';state.authorMessages=[];state.candidate=null;state.authorSaved=null;state.profileConfirmed=false;state.configAsked=false;state.ticketProfile=structuredClone(baseProfile);state.authorProfile=structuredClone(baseAuthor);state.draftReview='Opus 5.5';}
function closeDraft(discard=false){
 const keys=['draftTitle','draftBody','draftPrompt','draftMode','authorMessages','candidate','profileConfirmed','configAsked','ticketProfile','authorProfile','draftReview'];
 if(!discard&&!state.authorSaved&&(state.draftTitle||state.draftBody||state.authorMessages.length))state.boardDraft=Object.fromEntries(keys.map(k=>[k,structuredClone(state[k])]));
 else if(discard||state.authorSaved)state.boardDraft=null;
 const saved=state.authorSaved;clearDraft();state.page='board';note(saved?'Temporary discussion ended. The saved ticket remains in Backlog.':discard?'Temporary discussion discarded. No chat was archived.':state.boardDraft?'Kept only as a Board draft. No sidebar, Settled or Archive entry.':'Temporary discussion closed.');
}
function createTicket(title,body,p,review,origin=null){const id=Math.max(...state.tickets.map(t=>t.id))+1;state.tickets.push({id,title,body,column:'Backlog',phase:'Not started',worker:null,reviewer:null,starts:0,resumes:0,generation:0,intent:0,build:p.harness,model:p.model,effort:p.effort,access:p.access,review,instructions:[],origin});state.selected=id;return id;}
function authorMessage(text){
 text=text.trim();if(!text)return;state.authorMessages.push({role:'user',text});
 if(/\b(create|save)\b.*\bticket\b/i.test(text)&&state.candidate&&state.profileConfirmed){saveAuthor();return;}
 const p=state.ticketProfile;
 const config=/codex|claude code|opencode|gpt|opus|sonnet|use.*defaults|(?:low|medium|high)\s+(?:reasoning|effort)|(?:ask|auto|full)\s+(?:access|mode)|(?:reasoning|effort|access)\s*(?:to|is|:)?\s*(?:low|medium|high|ask|auto|full)/i.test(text);
 if(config){
  if(/use.*defaults/i.test(text))state.ticketProfile=structuredClone(baseProfile);
  else{if(/opencode/i.test(text)){p.harness='OpenCode';p.model='Project default';p.effort='Default';}else if(/claude|opus|sonnet/i.test(text)){p.harness='Claude Code';p.model=/sonnet/i.test(text)?'Sonnet 5':'Opus 5.5';}else if(/codex|gpt/i.test(text)){p.harness='Codex';p.model=/gpt.?6.?luna/i.test(text)?'GPT-6 Luna':'GPT-6.1 Sol';}const effort=text.match(/\b(low|medium|high)\b/i);if(effort&&p.harness!=='OpenCode')p.effort=effort[1][0].toUpperCase()+effort[1].slice(1).toLowerCase();const access=text.match(/\b(ask|auto|full)\b/i);if(access)p.access=access[1][0].toUpperCase()+access[1].slice(1).toLowerCase();}
  state.profileConfirmed=true;
 }else if(/^change (?:the )?title to\s+/i.test(text)&&state.candidate)state.candidate.title=text.replace(/^change (?:the )?title to\s+/i,'').replace(/[.!]$/,'');
 else if(!state.candidate)state.candidate={title:text.split(/[.!?\n]/)[0].slice(0,90),body:text};
 else state.candidate.body+='\n\n'+text;
 state.authorMessages.push({role:'assistant',text:state.profileConfirmed?`The ticket will use ${profileText(state.ticketProfile)}. Review will use ${state.draftReview}. Add any further details, ask me to change the wording, or create the ticket when ready.`:state.configAsked?'I’ve added that detail to the proposed ticket. Keep explaining what matters; the execution choices above are still available when you are ready.':'What should count as fixed? Also, which implementation model, reasoning and access should this ticket use? The current project defaults are Codex / GPT-6.1 Sol, High reasoning, Auto access, with Opus 5.5 for review. You can use those or tell me different settings.'});
 state.configAsked=true;
 state.draftPrompt='';
}
function saveAuthor(){if(!state.candidate||!state.profileConfirmed)return;if(state.authorSaved){note('This discussion already created its ticket.');return;}state.authorSaved=createTicket(state.candidate.title,state.candidate.body,state.ticketProfile,state.draftReview,'temporary-board-discussion');state.boardDraft=null;note(`LUN-${state.authorSaved} created by the board action. No working chat or archived discussion.`);}
function render(){
 const t=current();root.innerHTML=`<div class="lb-app"><div class="lb-top"><div class="lb-lights" aria-hidden="true"><span></span><span></span><span></span></div><div class="lb-top-title">LUNA / Design preview · sample tasks</div></div><div class="lb-layout">${sidebar()}<main class="lb-main">${state.page==='board'?board():state.page==='ticket'?details():state.page==='draft'?draft():conversation()}</main></div>${state.toast?`<div class="lb-toast" role="status">${ico('check-circle-2')}<span>${esc(state.toast)}</span>${button(ico('x'),'dismiss','','ghost','aria-label="Dismiss notification"')}</div>`:''}</div><div class="lb-demo"><span class="lb-demo-label">Preview workflow · ${key(t)}</span>${button('Simulate review','simulate-review',t.id,'',t.column==='Ready'&&t.phase==='Working'?'':'disabled')}${button('Simulate success & cleanup','simulate-success',t.id,'',t.column==='Ready'&&t.phase==='Reviewing'?'':'disabled')}</div>`;
 if(state.page==='chat'){
  const c=chat(state.chatId);
  if(c?.role==='main'&&!c.ticket&&c.id!=='planning')root.querySelector('.lb-messages').innerHTML='<div class="lb-empty-chat"><h3>New conversation</h3><p>No conversation history was copied.</p></div>';
  if(c?.reviewFor){const label=root.querySelector('.lb-messages .lb-message:last-child .lb-message-label');if(label)label.textContent=c.model||ticket(c.reviewFor).review;const context=root.querySelector('.lb-chat-context > span');if(context&&!c.archived)context.textContent='Reviewer · '+(c.model||ticket(c.reviewFor).review);}
 }
 if(state.page==='board')state.tickets.filter(x=>x.phase==='Reviewing').forEach(x=>{const label=root.querySelector(`[data-ticket="${x.id}"] .lb-reviewer`);if(label)label.innerHTML=ico('scan-search')+esc(chat(x.reviewer)?.model||x.review)+' reviewing';});
 if(state.page==='board'&&state.boardDraft)root.querySelector('.lb-toolbar').insertAdjacentHTML('beforeend',button(ico('message-square')+' Board draft (1)','resume-draft'));
 if(state.page==='draft')root.querySelector('.lb-demo').style.display='none';
 if(state.page==='ticket'){
  const props=[...root.querySelectorAll('.lb-detail-grid aside .lb-property')];
  props.forEach(row=>{if(row.firstElementChild?.textContent==='Reasoning')row.lastElementChild.textContent=t.effort||'High';});
  if(props[0])props[0].insertAdjacentHTML('afterend',`<div class="lb-property"><span>Model</span><span>${esc(t.model||'Project default')}</span></div><div class="lb-property"><span>Access</span><span>${esc(t.access||'Auto')}</span></div>`);
 }
 if(state.page==='chat'){
  const c=chat(state.chatId);const actions=root.querySelector('.lb-chat-actions');
  if(c&&!c.reviewFor&&!c.archived&&actions)actions.insertAdjacentHTML('beforeend',button(ico('ticket')+' Create ticket from this chat','create-in-chat'));
  const created=state.chatReceipts[c?.id];if(created)root.querySelector('.lb-messages').insertAdjacentHTML('beforeend',`<div class="lb-receipt">${ico('ticket')}<div>Created LUN-${created} in Backlog<small>Used project execution defaults. No additional chat was created.</small></div>${button('Open created ticket','ticket',created,'ghost')}</div>`);
 }

}
function dispatch(t){if(t.column!=='Ready'||t.phase==='Stopping')return;if(!t.worker){const id='work-'+t.id;state.chats.push({id,title:t.title,role:'main',ticket:t.id});t.worker=id;}t.generation++;t.reviewPassed=false;t.phase='Working';const initial=t.starts===0;const text=initial?`Work on ticket ${key(t)}: ${t.title}. ${t.body} Preserve unrelated changes, run the required checks and use ${t.review} for review. Complete only after checks and review pass.`:`Continue ticket ${key(t)} from the work already started in this chat. The previous run was stopped. Inspect the current files, partial results and latest brief; preserve completed work and do not restart from scratch. Resolve outstanding findings and finish checks and review.`;if(initial)t.starts++;else t.resumes++;t.instructions.push({kind:initial?'Start':'Continue',text});t.instructions=t.instructions.slice(-8);note(`${key(t)} ${initial?'started':'continued'} in the ${initial?'linked':'same'} chat. ${initial?'One initial instruction sent.':'A continuation instruction was sent.'}`);}
function finishStop(id,token){const t=ticket(id);if(!t||t.stopToken!==token)return;timers.delete(id);t.phase='Stopped';const r=chat(t.reviewer);if(r&&!r.archived)r.status='Stopped';if(t.column==='Ready')dispatch(t);else note(`${key(t)} stopped. Its chat and partial work are preserved.`);commit();}
function move(id,column){const t=ticket(id);if(!t||column===t.column)return;state.selected=t.id;t.intent++;if(column==='Done'){note('Done follows successful checks and review. Use the preview workflow controls to simulate that outcome.');return;}const was=t.column;t.column=column;if(column==='Ready'){if(t.phase==='Stopping'){note('Ready requested. Waiting for the previous run to stop before continuing.');}else dispatch(t);}else if(was==='Ready'&&['Working','Reviewing','Checking','Fixing','Starting'].includes(t.phase)){t.phase='Stopping';const token=(t.stopToken||0)+1;t.stopToken=token;const r=chat(t.reviewer);if(r&&!r.archived)r.status='Stopping';note(`${key(t)} Stop requested for the ticket and its owned review. No chat is archived.`);timers.set(t.id,setTimeout(()=>finishStop(t.id,token),1100));}else if(was==='Done'){t.phase='Stopped';t.reviewPassed=false;note(`${key(t)} reopened in Backlog. History is preserved.`);}else note(`${key(t)} remains held in Backlog.`);}
function review(t){if(t.column!=='Ready'||t.phase!=='Working')return;let r=chat(t.reviewer);if(!r||r.archived){const id='review-'+t.id+'-'+t.generation;r={id,title:'Review · '+key(t),role:'side',parent:mainFor(t),reviewFor:t.id,owner:t.worker,status:'Running',archived:false};state.chats.push(r);t.reviewer=id;}r.status='Running';r.generation=t.generation;r.model=t.review;t.phase='Reviewing';note(`${r.title} created as ${chat(t.worker).role==='main'?'a side chat under the ticket':'a sibling under '+chat(r.parent).title}.`);}
function succeed(t){const r=chat(t.reviewer);if(t.column!=='Ready'||t.phase!=='Reviewing'||!r||r.generation!==t.generation)return;r.status='Passed';t.reviewPassed=true;t.phase='Complete';t.column='Done';r.archived=true;r.closed=true;if(state.page==='chat'&&state.chatId===r.id)state.chatId=t.worker;note(`${key(t)} complete. ${r.title} closed and archived; the primary chat and review history remain.`);}
root.addEventListener('input',ev=>{const k=ev.target.dataset.field;if(!k)return;if(k==='query'){state.query=ev.target.value;const region=root.querySelector('.lb-board');const div=document.createElement('div');div.innerHTML=board();region.replaceWith(div.querySelector('.lb-board'));iconize();}else state[k]=ev.target.value;});
root.addEventListener('change',ev=>{
 const el=ev.target;if(el.dataset.profile){const p=el.dataset.profile==='ticket'?state.ticketProfile:state.authorProfile;p[el.dataset.key]=el.value;if(el.dataset.key==='harness'){p.model=catalog[p.harness][0];p.effort=p.harness==='OpenCode'?'Default':'High';}commit();}
 else if(el.dataset.field==='review'){current().review=el.value;note('Review preference saved for the next review run.');commit();}
 else if(el.dataset.field==='draftReview'){state.draftReview=el.value;persist();}
});
root.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;
 if(action==='board'){if(state.page==='draft')closeDraft();else state.page='board';}
 else if(action==='ticket'){if(state.page==='draft'&&state.authorSaved){state.boardDraft=null;clearDraft();}state.selected=Number(id);state.page='ticket';}
 else if(action==='chat'){if(state.page==='draft')closeDraft();state.chatId=id;state.page='chat';const c=chat(id);if(c?.ticket||c?.reviewFor)state.selected=c.ticket||c.reviewFor;}
 else if(action==='ready'||action==='backlog')move(id,action==='ready'?'Ready':'Backlog');
 else if(action==='simulate-review')review(ticket(id));
 else if(action==='simulate-success')succeed(ticket(id));
 else if(action==='review-details'){const t=ticket(id);if(t.reviewer){state.selected=t.id;state.chatId=t.reviewer;state.page='chat';}}
 else if(action==='dismiss')state.toast='';
 else if(action==='automations')note('Board stays directly below Automations.');
 else if(action==='new-ticket'){if(state.boardDraft){Object.assign(state,structuredClone(state.boardDraft));state.authorSaved=null;state.page='draft';note('Resumed the unfinished Board draft. Save or discard it before starting another.');}else{clearDraft();state.page='draft';state.draftMode='manual';}}
 else if(action==='manual'||action==='ai')state.draftMode=action;
 else if(action==='author-send')authorMessage(state.draftPrompt||'');
 else if(action==='author-defaults')authorMessage('Use project defaults.');
 else if(action==='author-claude')authorMessage('Use Claude Code with Opus 5.5, High reasoning and Ask access.');
 else if(action==='author-save')saveAuthor();

 else if(action==='resume-draft'){if(state.boardDraft){Object.assign(state,structuredClone(state.boardDraft));state.authorSaved=null;state.page='draft';}}
 else if(action==='save-ticket'){if(!state.draftTitle.trim())note('Add a ticket title first.');else{const id=createTicket(state.draftTitle.trim(),state.draftBody.trim(),state.ticketProfile,state.draftReview);state.boardDraft=null;clearDraft();state.page='board';note(`LUN-${id} saved to Backlog with its model, reasoning and access. No chat created.`);}}
 else if(action==='create-in-chat'){const c=chat(state.chatId);if(state.chatReceipts[c.id]){note('This preview action already created LUN-'+state.chatReceipts[c.id]+'.');}else{const id=createTicket('Follow-up: '+c.title,'Capture the follow-up work from this conversation, preserving the agreed scope and acceptance criteria.',baseProfile,'Opus 5.5',c.id);state.chatReceipts[c.id]=id;note(`LUN-${id} created in Backlog from this chat. Existing conversations are unchanged.`);}}
 else if(action==='new-main'){if(state.page==='draft')closeDraft();const id='main-'+Date.now();state.chats.push({id,title:'New conversation',role:'main',ticket:null});state.chatId=id;state.page='chat';note('New independent main chat.');}
 commit();});
root.addEventListener('dragstart',ev=>{const el=ev.target.closest('[data-ticket]');if(!el)return;draggedId=Number(el.dataset.ticket);ev.dataTransfer.setData('text/plain',String(draggedId));ev.dataTransfer.effectAllowed='move';el.classList.add('dragging');});
root.addEventListener('dragover',ev=>{const col=ev.target.closest('[data-drop]');if(!col)return;ev.preventDefault();ev.dataTransfer.dropEffect='move';root.querySelectorAll('.lb-col.over').forEach(e=>e.classList.remove('over'));col.classList.add('over');});
root.addEventListener('drop',ev=>{const col=ev.target.closest('[data-drop]');if(!col)return;ev.preventDefault();const id=Number(ev.dataTransfer.getData('text/plain'))||draggedId;move(id,col.dataset.drop);draggedId=null;commit();});
root.addEventListener('dragend',()=>{draggedId=null;root.querySelectorAll('.dragging,.over').forEach(e=>e.classList.remove('dragging','over'));});
window.addEventListener('openai:set_globals',ev=>{const v=ev.detail?.globals?.widgetState;if(v&&JSON.stringify(v.privateContent)!==lastPublished){restore(v);render();}});
render();
state.tickets.filter(t=>t.phase==='Stopping').forEach(t=>timers.set(t.id,setTimeout(()=>finishStop(t.id,t.stopToken),1100)));
})();
</script>
