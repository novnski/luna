let state=structuredClone(seed),lastPublished=null,draggedId=null;

function persist(){if(!window.openai?.setWidgetState)return;const copy=structuredClone(state);lastPublished=JSON.stringify(copy);if(new TextEncoder().encode(lastPublished).length&gt;14000)return;window.openai.setWidgetState({modelContent:{screen:state.page,authoringMode:state.page===&#x27;draft&#x27;?state.draftMode:null,implementationProfile:state.page===&#x27;draft&#x27;?state.ticketProfile:null,selectedTicket:key(current()),ticketStates:state.tickets.map(t=&gt;({id:key(t),column:t.column,phase:t.phase,starts:t.starts,resumes:t.resumes})),archivedReviewers:state.chats.filter(c=&gt;c.reviewFor&amp;&amp;c.archived).length},privateContent:copy}).catch(()=&gt;{});}

function mainFor(t){const c=chat(t.worker);return c?.role===&#x27;side&#x27;?c.parent:c?.id;}
function sideCount(id){return state.chats.filter(c=&gt;c.role===&#x27;side&#x27;&amp;&amp;c.parent===id&amp;&amp;!c.archived).length;}
function badge(t,review=false){return button(ico(review?&#x27;scan-search&#x27;:&#x27;ticket&#x27;)+`${review?&#x27;Review · &#x27;:&#x27;&#x27;}${key(t)}`,&#x27;ticket&#x27;,t.id,&#x27;soft&#x27;);}
function sidebar(){return `&lt;aside class=&quot;lb-side&quot;&gt;&lt;div class=&quot;lb-brand&quot;&gt;${ico(&#x27;moon&#x27;)}LUNA&lt;/div&gt;&lt;button class=&quot;lb-nav lb-new-nav&quot; data-action=&quot;new-main&quot;&gt;${ico(&#x27;square-pen&#x27;)}New chat&lt;span class=&quot;lb-key&quot;&gt;⌘ N&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;lb-nav&quot; data-action=&quot;automations&quot;&gt;${ico(&#x27;calendar-clock&#x27;)}Automations&lt;/button&gt;&lt;button class=&quot;lb-nav ${state.page!==&#x27;chat&#x27;?&#x27;active&#x27;:&#x27;&#x27;}&quot; data-action=&quot;board&quot;&gt;${ico(&#x27;columns-3&#x27;)}Board&lt;span class=&quot;lb-key&quot;&gt;${state.tickets.length}&lt;/span&gt;&lt;/button&gt;&lt;div class=&quot;lb-side-label&quot;&gt;Luna&lt;/div&gt;${state.chats.filter(c=&gt;c.role===&#x27;main&#x27;&amp;&amp;!c.archived).map(c=&gt;`&lt;button class=&quot;lb-thread ${state.page===&#x27;chat&#x27;&amp;&amp;(state.chatId===c.id||chat(state.chatId)?.parent===c.id)?&#x27;active&#x27;:&#x27;&#x27;}&quot; data-action=&quot;chat&quot; data-id=&quot;${c.id}&quot; data-tooltip=&quot;${esc(c.title)}&quot;&gt;${ico(c.ticket?&#x27;ticket&#x27;:&#x27;message-square&#x27;)}&lt;span class=&quot;lb-thread-text&quot;&gt;&lt;span class=&quot;lb-thread-title&quot;&gt;${esc(c.title)}&lt;/span&gt;&lt;span class=&quot;lb-thread-meta&quot;&gt;${c.ticket?&#x27;LUN-&#x27;+c.ticket+&#x27; · &#x27;:&#x27;&#x27;}${sideCount(c.id)?sideCount(c.id)+&#x27; side chats&#x27;:&#x27;Main chat&#x27;}&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;lb-side-foot&quot;&gt;&lt;span class=&quot;lb-avatar&quot;&gt;I&lt;/span&gt;&lt;span&gt;Iulian&lt;br&gt;Personal workspace&lt;/span&gt;&lt;/div&gt;&lt;/aside&gt;`;}
function card(t){const c=chat(t.worker);return `&lt;article class=&quot;lb-ticket&quot; draggable=&quot;true&quot; data-ticket=&quot;${t.id}&quot; aria-label=&quot;${key(t)} ${esc(t.title)}&quot;&gt;&lt;div class=&quot;lb-ticket-top&quot;&gt;${ico(&#x27;ticket&#x27;)}${key(t)}&lt;span style=&quot;margin-left:auto&quot;&gt;${ico(&#x27;grip-vertical&#x27;)}&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;lb-card-open&quot; data-action=&quot;ticket&quot; data-id=&quot;${t.id}&quot;&gt;${esc(t.title)}&lt;/button&gt;&lt;p class=&quot;lb-ticket-summary&quot;&gt;${esc(t.body)}&lt;/p&gt;&lt;div class=&quot;lb-phase&quot;&gt;&lt;span class=&quot;lb-status-mark ${t.column===&#x27;Done&#x27;?&#x27;done&#x27;:t.column===&#x27;Ready&#x27;?&#x27;progress&#x27;:&#x27;ready&#x27;}&quot;&gt;&lt;/span&gt;${esc(t.phase)}&lt;/div&gt;${t.reviewer?`&lt;div class=&quot;lb-reviewer&quot;&gt;${ico(&#x27;scan-search&#x27;)}${t.reviewPassed?&#x27;Review passed · archived&#x27;:t.phase===&#x27;Reviewing&#x27;?t.review+&#x27; reviewing&#x27;:&#x27;Reviewer retained&#x27;}&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;lb-location&quot;&gt;&lt;div class=&quot;lb-location-line&quot;&gt;${ico(!c?&#x27;circle-dashed&#x27;:c.role===&#x27;main&#x27;?&#x27;message-square&#x27;:&#x27;corner-down-right&#x27;)}${!c?&#x27;No chat yet&#x27;:c.role===&#x27;main&#x27;?&#x27;Main chat&#x27;:&#x27;Side chat&#x27;}&lt;/div&gt;${c?.role===&#x27;side&#x27;?`&lt;small&gt;${esc(chat(c.parent)?.title||&#x27;Main parent&#x27;)}&lt;/small&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;div class=&quot;lb-card-action&quot;&gt;${t.column===&#x27;Backlog&#x27;?button(ico(&#x27;play&#x27;)+(t.starts?&#x27; Resume&#x27;:&#x27; Start&#x27;),&#x27;ready&#x27;,t.id):t.column===&#x27;Ready&#x27;?button(ico(&#x27;square&#x27;)+&#x27; Stop&#x27;,&#x27;backlog&#x27;,t.id):button(&#x27;Review details&#x27;,&#x27;review-details&#x27;,t.id,&#x27;ghost&#x27;)}&lt;span class=&quot;lb-key&quot;&gt;${t.starts&amp;&amp;t.column===&#x27;Backlog&#x27;?&#x27;Same chat on resume&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;`;}
function board(){const visible=state.tickets.filter(t=&gt;!state.query||`${key(t)} ${t.title}`.toLowerCase().includes(state.query.toLowerCase()));return `&lt;div class=&quot;lb-heading&quot;&gt;&lt;div class=&quot;lb-grow&quot;&gt;&lt;h1&gt;Board&lt;/h1&gt;&lt;div class=&quot;lb-subtitle&quot;&gt;Move to Ready to start. Move back to stop.&lt;/div&gt;&lt;/div&gt;${button(ico(&#x27;plus&#x27;)+&#x27; New ticket&#x27;,&#x27;new-ticket&#x27;,&#x27;&#x27;,&#x27;primary&#x27;)}&lt;/div&gt;&lt;div class=&quot;lb-toolbar&quot;&gt;&lt;span class=&quot;lb-tag&quot;&gt;${ico(&#x27;folder&#x27;)}Luna&lt;/span&gt;&lt;label class=&quot;lb-search&quot;&gt;${ico(&#x27;search&#x27;)}&lt;input data-field=&quot;query&quot; value=&quot;${esc(state.query)}&quot; placeholder=&quot;Search tickets…&quot; aria-label=&quot;Search tickets&quot;&gt;&lt;/label&gt;&lt;span class=&quot;lb-toolbar-end lb-subtitle&quot;&gt;${ico(&#x27;scan-search&#x27;)} Automatic agent review&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lb-board&quot;&gt;${[&#x27;Backlog&#x27;,&#x27;Ready&#x27;,&#x27;Done&#x27;].map((col,i)=&gt;`&lt;section class=&quot;lb-col&quot; data-drop=&quot;${col}&quot; aria-label=&quot;${col}&quot;&gt;&lt;div class=&quot;lb-col-heading&quot;&gt;&lt;span class=&quot;lb-status-mark ${[&#x27;ready&#x27;,&#x27;progress&#x27;,&#x27;done&#x27;][i]}&quot;&gt;&lt;/span&gt;${col}&lt;span class=&quot;lb-count&quot;&gt;${visible.filter(t=&gt;t.column===col).length}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lb-col-hint&quot;&gt;${[&#x27;Held or stopped&#x27;,&#x27;Runs automatically&#x27;,&#x27;Verified and reviewed&#x27;][i]}&lt;/div&gt;${visible.filter(t=&gt;t.column===col).map(card).join(&#x27;&#x27;)||&#x27;&lt;div class=&quot;lb-empty-col&quot;&gt;Drop a ticket here&lt;/div&gt;&#x27;}&lt;/section&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;lb-board-foot&quot;&gt;&lt;span&gt;${ico(&#x27;corner-down-right&#x27;)}Reviewers are temporary side chats&lt;/span&gt;&lt;span&gt;${ico(&#x27;archive&#x27;)}Closed and archived after success&lt;/span&gt;&lt;/div&gt;`;}
function details(){const t=current(),c=chat(t.worker),r=chat(t.reviewer);return `&lt;div class=&quot;lb-breadcrumb&quot;&gt;${button(ico(&#x27;arrow-left&#x27;)+&#x27; Board&#x27;,&#x27;board&#x27;,&#x27;&#x27;,&#x27;ghost&#x27;)} / ${key(t)}&lt;/div&gt;&lt;div class=&quot;lb-detail-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;lb-tag ${t.column===&#x27;Done&#x27;?&#x27;good&#x27;:t.column===&#x27;Ready&#x27;?&#x27;running&#x27;:&#x27;&#x27;}&quot;&gt;${esc(t.column)} · ${esc(t.phase)}&lt;/span&gt;&lt;h2&gt;${esc(t.title)}&lt;/h2&gt;&lt;div class=&quot;lb-subtitle&quot;&gt;${c?&#x27;One working chat, preserved across stops&#x27;:&#x27;No working chat until you move this to Ready&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;lb-detail-grid&quot;&gt;&lt;div&gt;&lt;section class=&quot;lb-section&quot;&gt;&lt;div class=&quot;lb-section-title&quot;&gt;Description&lt;/div&gt;&lt;p class=&quot;lb-bodytext&quot;&gt;${esc(t.body)}&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;lb-section&quot;&gt;&lt;div class=&quot;lb-section-title&quot;&gt;Working chat&lt;/div&gt;${c?`&lt;button class=&quot;lb-worklink&quot; data-action=&quot;chat&quot; data-id=&quot;${c.id}&quot;&gt;${ico(c.role===&#x27;side&#x27;?&#x27;corner-down-right&#x27;:&#x27;message-square&#x27;)}&lt;span&gt;${esc(c.title)}&lt;small&gt;${c.role===&#x27;main&#x27;?&#x27;Main chat in the sidebar&#x27;:&#x27;Side chat in &#x27;+esc(chat(c.parent)?.title)}&lt;/small&gt;&lt;/span&gt;${ico(&#x27;arrow-up-right&#x27;)}&lt;/button&gt;`:&#x27;&lt;p class=&quot;lb-subtitle&quot;&gt;A first start from Board creates a new main chat.&lt;/p&gt;&#x27;}&lt;/section&gt;&lt;section class=&quot;lb-section&quot;&gt;&lt;div class=&quot;lb-section-title&quot;&gt;Review&lt;/div&gt;${r?`&lt;button class=&quot;lb-worklink&quot; data-action=&quot;chat&quot; data-id=&quot;${r.id}&quot;&gt;${ico(&#x27;scan-search&#x27;)}&lt;span&gt;${esc(r.title)}&lt;small&gt;${r.archived?&#x27;Passed · closed and archived&#x27;:r.status+&#x27; · side chat in &#x27;+esc(chat(r.parent)?.title)}&lt;/small&gt;&lt;/span&gt;${ico(r.archived?&#x27;archive&#x27;:&#x27;arrow-up-right&#x27;)}&lt;/button&gt;&lt;p class=&quot;lb-state-note&quot;&gt;${r.archived?&#x27;Review history is preserved. Opening it does not restart or unarchive the reviewer.&#x27;:&#x27;Reports back to &#x27;+key(t)+&#x27;. The reviewer closes and archives only after review and ticket success.&#x27;}&lt;/p&gt;`:`&lt;p class=&quot;lb-subtitle&quot;&gt;${esc(t.review)} will review the changes in a temporary side chat.&lt;/p&gt;`}&lt;/section&gt;&lt;details class=&quot;lb-instruction&quot;&gt;&lt;summary&gt;Dispatch history · ${t.starts} start · ${t.resumes} continuation${t.resumes===1?&#x27;&#x27;:&#x27;s&#x27;}&lt;/summary&gt;${t.instructions.map(x=&gt;`&lt;p&gt;&lt;strong&gt;${esc(x.kind)}&lt;/strong&gt;&lt;br&gt;${esc(x.text)}&lt;/p&gt;`).join(&#x27;&lt;br&gt;&#x27;)||&#x27;&lt;p&gt;No execution instruction sent.&lt;/p&gt;&#x27;}&lt;/details&gt;&lt;/div&gt;&lt;aside&gt;&lt;div class=&quot;lb-property&quot;&gt;&lt;span&gt;Implement with&lt;/span&gt;&lt;span&gt;${esc(t.build)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lb-property&quot;&gt;&lt;span&gt;Review with&lt;/span&gt;&lt;select class=&quot;lb-select&quot; aria-label=&quot;Review model&quot; data-field=&quot;review&quot;&gt;&lt;option ${t.review===&#x27;Opus 5.5&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Opus 5.5&lt;/option&gt;&lt;option ${t.review===&#x27;Project default&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Project default&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;lb-property&quot;&gt;&lt;span&gt;Reasoning&lt;/span&gt;&lt;span&gt;High&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lb-property&quot;&gt;&lt;span&gt;Completion&lt;/span&gt;&lt;span&gt;Automatic&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lb-launch&quot;&gt;&lt;h3&gt;${t.column===&#x27;Backlog&#x27;?(t.starts?&#x27;Continue when ready&#x27;:&#x27;Start when ready&#x27;):t.column===&#x27;Done&#x27;?&#x27;Work completed&#x27;:&#x27;Ready means enabled&#x27;}&lt;/h3&gt;&lt;p&gt;${t.column===&#x27;Backlog&#x27;?(t.starts?&#x27;Your chat and partial work are kept. The next instruction continues the work.&#x27;:&#x27;Moving to Ready creates the chat and sends the first instruction.&#x27;) :t.column===&#x27;Done&#x27;?&#x27;Checks and review passed. The primary chat stays available.&#x27;:&#x27;Move back to Backlog to use the same Stop action as the chat.&#x27;}&lt;/p&gt;${t.column===&#x27;Backlog&#x27;?button(ico(&#x27;play&#x27;)+(t.starts?&#x27; Move to Ready &amp; continue&#x27;:&#x27; Move to Ready &amp; start&#x27;),&#x27;ready&#x27;,t.id,&#x27;primary&#x27;):t.column===&#x27;Ready&#x27;?button(ico(&#x27;square&#x27;)+&#x27; Stop &amp; move to Backlog&#x27;,&#x27;backlog&#x27;,t.id):button(&#x27;Reopen in Backlog&#x27;,&#x27;backlog&#x27;,t.id)}&lt;/div&gt;&lt;/aside&gt;&lt;/div&gt;`;}
